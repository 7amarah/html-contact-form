<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- SEO Meta Tags -->

            content="Contact Acme Support. Send a message about general enquiries, technical support or feedback, and we will get back to you.">
        <link rel="canonical" href="https://7amarah.github.io/html-contact-form/">
        <meta name="author" content="Tamarabrakaemi Waritimi">
        <meta name="robots" content="index, follow">
        <meta name="theme-color" content="#0f172a">

        <!-- Open Graph / Social Sharing -->
        <meta property="og:type" content="website">
        <meta property="og:title" content="Contact Us | Acme Support">
        <meta property="og:description"
            content="Send Acme Support a message about general enquiries, technical support or feedback.">
        <meta property="og:url" content="https://7amarah.github.io/html-contact-form/">
        <meta property="og:image" content="https://7amarah.github.io/html-contact-form/og-image.png">
        <meta property="og:image:alt" content="Acme Support contact form">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:site_name" content="Acme Support">
        <meta property="og:locale" content="en_NG">

        <!-- Twitter / X Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Contact Us | Acme Support">
        <meta name="twitter:description"
            content="Send Acme Support a message about general enquiries, technical support or feedback.">
        <meta name="twitter:image" content="https://7amarah.github.io/html-contact-form/og-image.png">
        <meta name="twitter:image:alt" content="Acme Support contact form">

        <!-- Favicons -->
        <link rel="icon" href="./favicon.ico" sizes="any">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="manifest" href="./site.webmanifest">
    </head>

    <body>
        <header>
            <h1>Acme Support</h1>
            <nav>
                <a href="./index.html">Home</a> /
                <a href="#">Help</a> /
                <a href="#">Contact</a>
            </nav>
        </header>

        <main>
            <h2>Contact Us</h2>
            <p>Send us a message and we will get back to you.</p>

            <form action="https://httpbin.org/post" method="post">
                <p>
                    <label for="fullName">Name</label>
                    <input id="fullName" name="fullName" type="text" required>
                </p>

                <p>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </p>

                <p>
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject">
                        <option value="">Choose a topic</option>
                        <option value="general">General Inquiry</option>
                        <option value="support">Technical Support</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </p>

                <p>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
                </p>

                <fieldset>
                    <legend>How did you hear about us?</legend>
                    <label><input type="radio" name="hearAbout" value="starter">Search</label>
                    <label><input type="radio" name="hearAbout" value="team">Friend</label>
                    <label><input type="radio" name="hearAbout" value="business">Social Media</label>
                </fieldset>

                <p>
                    <label>
                        <input type="checkbox" name="newsletter" value="yes">
                        Send me product updates
                    </label>
                </p>

                <p>
                    <button type="submit">Send message</button>
                </p>
            </form>
        </main>

        <footer>
            <p><small>&copy; 2026 Acme Support.</small></p>
        </footer>
    </body>
</html>
